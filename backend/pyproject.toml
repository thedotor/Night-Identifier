[project]
name = "night-identifier-backend"
version = "0.1.0"
description = "Local backend for the Night Sky Object Identifier desktop app"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "sqlalchemy>=2.0.35",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "python-multipart>=0.0.9",
  "Pillow>=10.4.0",
  "rawpy>=0.21.0",
  "watchdog>=5.0.3",
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "ultralytics>=8.3.0",
  "pyyaml>=6.0.2",
  "numpy>=1.26.0",
  "opencv-python>=4.10.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "httpx>=0.27.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
