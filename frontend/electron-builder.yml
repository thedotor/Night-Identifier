appId: com.nightidentifier.app
productName: Night Identifier
directories:
  output: release
files:
  - out/**
  - resources/**
  - package.json
# The PyInstaller backend folder (built by "Build Installer.bat") ships next to the app; the main
# process starts resources/backend/night-identifier-backend.exe.
extraResources:
  - from: ../backend/dist/night-identifier-backend
    to: backend
# electron-builder only produces the unpacked app folder (release/win-unpacked). The installer itself
# is made by Inno Setup (installer/night-identifier.iss) because NSIS can't handle a multi-GB payload.
win:
  icon: build/icon.ico
  target:
    - target: dir
      arch: x64
